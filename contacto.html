<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Perfumes Suus</title>
    <link rel="stylesheet" href="css/estilo_global.css">
</head>
<body>

    <header class="encabezado-principal">
        <div class="col-3">
            <img src="img/Logo_pagina_web.png" alt="Logo pagina web" class="logo-img">
        </div>
        
        <div class="col-6 contenedor-centrado">
            <h1 class="titulo-sitio">Perfumes Suus</h1>
            <nav class="menu-principal">
                <ul>
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li>
                        <a href="carrito.html">
                            Mi Carrito 🛒 <span id="contador-carrito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="col-3 alineacion-derecha">
            <nav class="menu-secundario">
                <a href="login.html">Iniciar Sesión</a> 
                <span class="separador-menu">|</span> 
                <a href="registro.html">Registrar usuario</a>
            </nav>
        </div>
    </header>

    <main class="tarjeta-seccion contenedor-login">
        <div class="encabezado-contacto">
            <h2 class="titulo-seccion titulo-sin-borde">Perfumes Suus</h2>
        </div>

        <div class="banner-contacto">
            FORMULARIO DE CONTACTOS
        </div>
        
        <form id="formulario-contacto" class="formulario-auth" novalidate>
            <div class="grupo-form">
                <label for="nombre-contacto">NOMBRE COMPLETO</label>
                <input type="text" id="nombre-contacto" maxlength="100">
                <span id="error-nombre-contacto" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="correo-contacto">CORREO</label>
                <input type="email" id="correo-contacto" maxlength="100">
                <span id="error-correo-contacto" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="comentario-contacto">CONTENIDO</label>
                <textarea id="comentario-contacto" rows="5" maxlength="500"></textarea>
                <span id="error-comentario-contacto" class="mensaje-error"></span>
            </div>

            <div class="acciones-contacto">
                <button type="submit" class="boton-principal btn-mitad">ENVIAR MENSAJE</button>
            </div>
        </form>
    </main>

    <footer class="pie-pagina">
        <p>Perfumes Suus - Todos los derechos reservados.</p>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
