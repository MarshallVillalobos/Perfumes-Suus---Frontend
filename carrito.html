<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Perfumes Suus</title>
    <link rel="stylesheet" href="css/estilo_global.css">
</head>
<body>
    
<header class="encabezado-principal contenedor-filas">
        <div class="col-3">
            <img src="img/Logo_pagina_web.png" alt="Logo pagina web" class="logo-img">
        </div>
        
        <div class="col-6 contenedor-centrado">
            <h1 class="titulo-sitio">Perfumes Suus</h1>
            <nav class="menu-principal">
                <ul>
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li>
                        <a href="carrito.html">
                            Mi Carrito <span id="contador-carrito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="col-3 alineacion-derecha">
            <nav class="menu-secundario">
                <a href="login.html">Iniciar Sesión</a> 
                <span class="separador-menu">|</span> 
                <a href="registro.html">Registrar usuario</a>
            </nav>
        </div>
    </header>

    <main class="tarjeta-seccion">
        <div class="contenedor-filas">
            <div class="col-8" id="lista-carrito">
            </div>
            
            <div class="col-4 resumen-carrito">
                <h3>TOTAL: <span id="total-carrito" style="float: right;">$0</span></h3>
                
                <label for="cupon">Ingrese cupón de descuento:</label>
                <div class="contenedor-cupon">
                    <input type="text" id="cupon">
                    <button class="btn-aplicar">Aplicar</button>
                </div>
                
                <button class="boton-principal btn-pagar" >PAGAR</button>
            </div>
        </div>
    </main>

    <footer class="pie-pagina">
        <p>Perfumes Suus - Todos los derechos reservados.</p>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
