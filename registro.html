<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Perfumes Suus</title>
    <link rel="stylesheet" href="css/estilo_global.css">
</head>
<body>

    <header class="encabezado-principal">
        <div class="col-3">
            <img src="img/Logo_pagina_web.png" alt="Logo pagina web" class="logo-img">
        </div>
        
        <div class="col-6 contenedor-centrado">
            <h1 class="titulo-sitio">Perfumes Suus</h1>
            <nav class="menu-principal">
                <ul>
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li>
                        <a href="carrito.html">
                            Mi Carrito <span id="contador-carrito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="col-3 alineacion-derecha">
            <nav class="menu-secundario">
                <a href="login.html">Iniciar Sesión</a> 
                <span class="separador-menu">|</span> 
                <a href="registro.html">Registrar usuario</a>
            </nav>
        </div>
    </header>

    <main class="tarjeta-seccion contenedor-login">
        <h2 class="titulo-seccion">Registro de Usuario</h2>
        
        <form id="formulario-registro" class="formulario-auth" novalidate>
            
            <div class="grupo-form">
                <label for="run">RUN (Sin puntos ni guion)</label>
                <input type="text" id="run" placeholder="Ej: 190110222" maxlength="9">
                <span id="error-run" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
                <span id="error-nombre" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Tus apellidos">
                <span id="error-apellidos" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="correo-reg">Correo Electrónico</label>
                <input type="email" id="correo-reg" placeholder="ejemplo@duoc.cl">
                <span id="error-correo-reg" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="fecha-nac">Fecha de Nacimiento (Opcional)</label>
                <input type="date" id="fecha-nac">
            </div>

            <div class="grupo-form">
                <label for="region">Región</label>
                <select id="region">
                    <option value="">-- Seleccione una región --</option>
                </select>
                <span id="error-region" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="comuna">Comuna</label>
                <select id="comuna">
                    <option value="">-- Seleccione una comuna --</option>
                </select>
                <span id="error-comuna" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" placeholder="Tu dirección completa" maxlength="300">
                <span id="error-direccion" class="mensaje-error"></span>
            </div>

            <button type="submit" class="boton-principal btn-block">Registrarse</button>
        </form>
    </main>

    <footer class="pie-pagina">
        <p>Perfumes Suus - Todos los derechos reservados.</p>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
