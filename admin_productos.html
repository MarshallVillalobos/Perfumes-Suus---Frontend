<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Administrador Perfumes Suus</title>
    <link rel="stylesheet" href="css/estilo_global.css">
</head>
<body class="body-admin">

    <div class="contenedor-admin">
        
        <aside class="sidebar-admin">
            <div class="logo-admin">
                <img src="img/Logo_pagina_web.png" alt="Logo Perfumes Suus" class="logo-admin-img">
                <h3>Suus Admin</h3>
            </div>
            
            <nav class="menu-admin">
                <ul>
                    <li><a href="admin_home.html">Dashboard</a></li>
                    <li class="activo"><a href="admin_productos.html">Productos</a></li>
                    <li><a href="admin_usuarios.html">Usuarios</a></li>
                </ul>
            </nav>

            <div class="perfil-admin">
                <p><strong>Configuración</strong></p>
                <p>Perfil</p>
                <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="contenido-admin">
            
            <header class="header-mantenedor">
                <h1>Productos</h1>
                <a href="admin_nuevo_producto.html" class="boton-oscuro">NUEVO PRODUCTO</a>
            </header>

            <section class="panel-contenido">
                <div class="filtro-tabla">
                    <label for="filtro-categoria">Filtrar por: </label>
                    <select id="filtro-categoria">
                        <option>Todas las categorías</option>
                        <option>Perfumes Árabes</option>
                        <option>Perfumes de Nicho</option>
                        <option>Perfumes de Autor</option>
                    </select>
                </div>

                <div class="contenedor-tabla">
                    <table class="tabla-admin">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Imagen</th>
                                <th>Nombre del Producto</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>

                            <tr>
                                <td>001</td>
                                <td><img src="img/perfume_principal.webp" alt="Andrews Eau de Parfum" class="img-tabla-admin"></td>
                                <td>Andrews Eau de Parfum</td>
                                <td>$50.000</td>
                                <td><span class="etiqueta rol-admin">15 und.</span></td>
                                <td>
                                    <button class="btn-icono editar" title="Editar Producto">✏️</button>
                                    <button class="btn-icono eliminar" title="Eliminar Producto">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td>002</td>
                                <td><img src="img/perfume_principal.webp" alt="Power of You" class="img-tabla-admin"></td>
                                <td>Power of You</td>
                                <td>$65.000</td>
                                <td><span class="etiqueta rol-admin">8 und.</span></td>
                                <td>
                                    <button class="btn-icono editar" title="Editar Producto">✏️</button>
                                    <button class="btn-icono eliminar" title="Eliminar Producto">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td>003</td>
                                <td><img src="img/perfume_principal.webp" alt="Oud Wood Intense" class="img-tabla-admin"></td>
                                <td>Oud Wood Intense</td>
                                <td>$85.000</td>
                                <td><span class="etiqueta rol-cliente">Sin Stock</span></td>
                                <td>
                                    <button class="btn-icono editar" title="Editar Producto">✏️</button>
                                    <button class="btn-icono eliminar" title="Eliminar Producto">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td>004</td>
                                <td><img src="img/perfume_principal.webp" alt="Santal 33" class="img-tabla-admin"></td>
                                <td>Santal 33</td>
                                <td>$120.000</td>
                                <td><span class="etiqueta rol-admin">3 und.</span></td>
                                <td>
                                    <button class="btn-icono editar" title="Editar Producto">✏️</button>
                                    <button class="btn-icono eliminar" title="Eliminar Producto">🗑️</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="paginacion">
                    <button>«</button>
                    <button>‹</button>
                    <button class="activo">1</button>
                    <button>2</button>
                    <button>›</button>
                    <button>»</button>
                </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
