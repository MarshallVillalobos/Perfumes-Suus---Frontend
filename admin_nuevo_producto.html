<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Administrador Perfumes Suus</title>
    <link rel="stylesheet" href="css/estilo_global.css">
</head>
<body class="body-admin">

    <div class="contenedor-admin">
        
        <!-- Menú Lateral -->
        <aside class="sidebar-admin">
            <div class="logo-admin">
                <img src="img/Logo_pagina_web.png" alt="Logo Perfumes Suus" class="logo-admin-img">
                <h3>Suus Admin</h3>
            </div>
            
            <nav class="menu-admin">
                <ul>
                    <li><a href="admin_home.html">Dashboard</a></li>
                    <li class="activo"><a href="admin_productos.html">Productos</a></li>
                    <li><a href="admin_usuarios.html">Usuarios</a></li>
                </ul>
            </nav>

            <div class="perfil-admin">
                <p><strong>Configuración</strong></p>
                <p>Perfil</p>
                <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="contenido-admin">
            
            <header class="header-mantenedor">
                <h1>Nuevo Producto</h1>
                <a href="admin_productos.html" class="boton-oscuro btn-gris">VOLVER AL LISTADO</a>
            </header>

            <section class="panel-contenido">
                <div class="tarjeta-formulario-admin">
                    <h2 class="titulo-formulario-admin">Datos del Producto</h2>
                    
                    <form id="formulario-nuevo-producto" novalidate>
                        
                        <div class="grupo-form-admin">
                            <label for="codigo-prod">Código Producto *</label>
                            <input type="text" id="codigo-prod" placeholder="Ej: PRD-001" minlength="3">
                            <span id="error-codigo-prod" class="mensaje-error"></span>
                        </div>

                        <div class="grupo-form-admin">
                            <label for="nombre-prod">Nombre *</label>
                            <input type="text" id="nombre-prod" placeholder="Nombre del perfume" maxlength="100">
                            <span id="error-nombre-prod" class="mensaje-error"></span>
                        </div>

                        <div class="grupo-form-admin">
                            <label for="desc-prod">Descripción (Opcional)</label>
                            <textarea id="desc-prod" rows="3" placeholder="Detalles aromáticos..." maxlength="500"></textarea>
                            <span id="error-desc-prod" class="mensaje-error"></span>
                        </div>

                        <div class="fila-form-admin">
                            <div class="grupo-form-admin col-mitad">
                                <label for="precio-prod">Precio *</label>
                                <input type="number" id="precio-prod" placeholder="Ej: 50000" min="0" step="0.01">
                                <span id="error-precio-prod" class="mensaje-error"></span>
                            </div>

                            <div class="grupo-form-admin col-mitad">
                                <label for="stock-prod">Stock Inicial *</label>
                                <input type="number" id="stock-prod" placeholder="Ej: 10" min="0" step="1">
                                <span id="error-stock-prod" class="mensaje-error"></span>
                            </div>
                        </div>

                        <div class="fila-form-admin">
                            <div class="grupo-form-admin col-mitad">
                                <label for="categoria-prod">Categoría *</label>
                                <select id="categoria-prod">
                                    <option value="">-- Seleccione --</option>
                                    <option value="arabes">Perfumes Árabes</option>
                                    <option value="nicho">Perfumes de Nicho</option>
                                    <option value="autor">Perfumes de Autor</option>
                                </select>
                                <span id="error-categoria-prod" class="mensaje-error"></span>
                            </div>

                            <div class="grupo-form-admin col-mitad">
                                <label for="stock-critico-prod">Stock Crítico (Opcional)</label>
                                <input type="number" id="stock-critico-prod" placeholder="Alerta si baja de..." min="0" step="1">
                                <span id="error-stock-critico-prod" class="mensaje-error"></span>
                            </div>
                        </div>

                        <div class="grupo-form-admin">
                            <label for="imagen-prod">URL de Imagen (Opcional)</label>
                            <input type="text" id="imagen-prod" placeholder="img/nuevo_perfume.webp">
                        </div>

                        <div class="acciones-formulario-admin">
                            <button type="submit" class="boton-oscuro btn-largo">GUARDAR PRODUCTO</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
